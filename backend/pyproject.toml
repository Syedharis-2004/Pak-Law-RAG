[project]
name = "paklawai-backend"
version = "1.0.0"
description = "PakLaw AI - Enterprise AI Legal Platform Backend"
requires-python = ">=3.12"

dependencies = [
    "fastapi[all]>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "celery[redis]>=5.4.0",
    "redis>=5.2.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "slowapi>=0.1.9",
    "langchain>=0.3.12",
    "langchain-google-genai>=2.0.7",
    "langchain-groq>=0.2.0",
    "langchain-community>=0.3.12",
    "langgraph>=0.2.59",
    "llama-index>=0.12.0",
    "llama-index-vector-stores-qdrant>=0.1.0",
    "qdrant-client>=1.12.2",
    "sentence-transformers>=3.3.1",
    "FlagEmbedding>=1.3.3",
    "paddlepaddle>=2.6.2",
    "paddleocr>=2.9.1",
    "pypdf>=5.1.0",
    "pdf2image>=1.17.0",
    "python-docx>=1.1.2",
    "beautifulsoup4>=4.12.3",
    "langdetect>=1.0.9",
    "reportlab>=4.2.5",
    "python-pptx>=1.0.2",
    "aiofiles>=24.1.0",
    "rich>=13.9.4",
    "email-validator>=2.2.0",
    "python-slugify>=8.0.4",
    "uuid7>=0.1.0",
    "motor>=3.7.1",
    "pymongo>=4.17.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "factory-boy>=3.3",
    "faker>=33.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501", "B008", "N805", "N818", "BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ai"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]


[tool.setuptools]
packages = ["app"]
